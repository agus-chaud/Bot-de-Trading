# Contrato de configuración — VARIANTE DE INVESTIGACIÓN (NO producción).
#
# Tercer frente del plan anti-factor (docs/plan_hedge_short.md, Fase 2):
# parte de la cartera DIVERSIFICADA (ADR-060) y convierte el sleeve corto (30%) en
# COBERTURA real en vez de momentum-long. Se evalúa con el walk-forward de research
# (ADR-058) comparando: concentrada -> diversificada -> diversificada+hedge.
#
# Esta policy NO se valida contra config/policy.v1.schema.json (additionalProperties:
# false rechazaría short_hedge). Los scripts de research la cargan con yaml.safe_load.
# El gate congelado (ADR-041) y producción (policy.v1.yaml) quedan intactos.

schema_version: 1
profile: moderate

# Reparto objetivo corto/largo (debe sumar 1.0) — NO se toca todavía (plan Fase 2).
weights:
  short: 0.30
  long: 0.70

# Reparto geográfico AR/US sobre el total (debe sumar 1.0)
geo:
  AR: 0.20
  US: 0.80

short_kill_switch_monthly_dd: -0.08

cadence:
  short: daily
  long: weekly

execution_mode: semi_auto

symbols:
  whitelist_us_file: config/symbols/whitelist_us.yaml
  whitelist_ar_file: config/symbols/whitelist_ar.yaml
  whitelist_cedear_file: config/symbols/whitelist_cedear.yaml
  whitelist_hedge_file: config/symbols/whitelist_hedge.yaml   # canasta de cobertura (Fase 0/1)
  inline_us: []
  inline_ar: []
  universe_selection:
    enabled: false
    rebalance_frequency: weekly
    targets:
      merval_top_n: 10
      cedears_top_n: 20
    volume_window_trading_days: 20
    tiebreakers:
      - avg_notional_desc
      - symbol_asc
    api_budget:
      monthly_limit: 25000
      soft_limit_pct: 0.8
      max_calls_per_job: 2000

risk:
  max_notional_per_ticker_pct: 0.08
  max_sector_pct: 0.25
  max_daily_loss_short_pct: -0.02
  max_daily_loss_long_pct: -0.015
  max_daily_loss_total_pct: -0.03
  max_monthly_loss_short_pct: -0.08
  max_monthly_loss_long_pct: -0.06
  max_monthly_loss_total_pct: -0.10
  no_trade_first_minutes: 15
  no_trade_last_minutes: 15
  news_window_enabled: false
  halt_on_data_quality: true
  adv_min_shares_day: 500000
  short_kill_switch_until: manual_reset
  stop_loss:
    atr_multiplier: 2.0
    atr_lookback: 14
    fallback_pct_us: -0.05
    fallback_pct_ar: -0.08

# Motor largo (sleeve 70%): cartera diversificada de ADR-060 (50% AR + 50% global).
long_term_engine:
  drift_rebalance_threshold_pp: 2.0
  drift_convention: per_line
  rebalance_rule: first_ar_business_day_of_calendar_week
  max_long_rebalance_turnover_pct: null
  satellite_markets:
    - AR
  core_lines:
    - symbol: GGAL
      target_weight: 0.167
    - symbol: PAMP
      target_weight: 0.167
    - symbol: TXAR
      target_weight: 0.166
    - symbol: SPY
      target_weight: 0.167
    - symbol: QQQ
      target_weight: 0.167
    - symbol: KO
      target_weight: 0.166
  satellite_lines: []
  satellite_limits:
    max_satellite_weight_total: 0.20
    max_weight_per_satellite_line: 0.15
    max_satellite_names: 3

# ─────────────────────────────────────────────────────────────────────────────
# COBERTURA DEL SLEEVE CORTO (plan_hedge_short, Fase 2) — el cambio de esta variante.
# Reparte el 30% del bucket corto en: hedge estático (anti-factor) + táctico (momentum).
# Pesos como FRACCIÓN DEL TOTAL: hedge 0.20 + tactical 0.10 = weights.short (0.30).
# El motor (short_hedge_engine.py) y la regla de des-riesgo a cash llegan en Fase 4.
short_hedge:
  enabled: true
  mode: hedge_static                 # asignación de factor estática, NO ranking de momentum
  hedge_weight_total: 0.20           # 2/3 del bucket corto → cobertura anti-factor
  tactical_weight_total: 0.10        # 1/3 del bucket corto → momentum corto existente
  drift_rebalance_threshold_pp: 2.0  # rebalanceo por bandas (copiado del largo)
  # Canasta de cobertura (Fase 0/1): GLD + KO, corr en crisis <= 0 vs GGAL/PAMP.
  # Pesos internos del bloque hedge (suman 1.0 dentro de hedge_weight_total).
  hedge_lines:
    - symbol: GLD
      target_weight: 0.50
    - symbol: KO
      target_weight: 0.50
  # Regla de des-riesgo a cash para el crash GLOBAL (ventanas 4/5): se DEFINE en Fase 4.
  # Umbrales pre-registrados en Fase 3 (anti p-hacking). Placeholder declarado, apagado.
  derisk_to_cash:
    enabled: false
    trigger: ar_factor_and_global_both_in_drawdown
    ar_factor_drawdown_floor: null    # a pre-registrar (Fase 3)
    global_drawdown_floor: null       # a pre-registrar (Fase 3)

# Parámetros del short_term_engine (sleeve táctico del 10%)
short_term_engine:
  momentum_lookback_days: 20
  liquidity_percentile_min: 0.60
  volatility_20d_max: 0.04
  top_k_per_market: 5
  risk_budget_trade_pct: 0.005
  rsi_lookback: 14
  rsi_overbought_entry: 80.0
  rsi_exit_threshold: 45.0
  allow_leverage: false

short_term_pre_gate:
  enabled: true
  walk_forward:
    oos_trading_days: 12
    step_trading_days: 10
    min_oos_windows: 2
  thresholds:
    monthly_short_drawdown_floor: -0.25
    max_fee_pct_of_initial_per_window: 0.05
    max_turnover_annualized: 500.0

markets:
  US:
    commission_bps_per_side: 1.0
    slippage_bps: 2.0
  AR:
    commission_bps_per_side: 15.0
    slippage_bps: 5.0

logging:
  level: INFO
  structured: true

data_providers:
  us_ohlcv: placeholder_provider_us
  ar_ohlcv: placeholder_provider_ar

calendar:
  source_of_truth: config/calendars/trading_days.v1.yaml
  us_market_code: XNYS
  ar_market_code: BYMA

corporate_actions:
  us_file: config/corporate_actions/us_actions.v1.yaml
  supported_types:
    - split
    - dividend

data_quality_confidence:
  high:
    min_n_observations: 60
    max_imputed_pct: 2.0
  medium:
    min_n_observations: 20
    max_imputed_pct: 5.0

validation_wf:
  lookback_trading_days: 90

kpi_oos_gate:
  enabled: true
  walk_forward:
    burn_in_trading_days: 252
    oos_trading_days: 60
    step_trading_days: 30
    min_oos_windows: 1
  aggregate:
    rule: all
  thresholds:
    min_sharpe_annualized_total: 0.30
    min_sortino_annualized_total: 0.40
    max_drawdown_total_floor: -0.18
    max_drawdown_short_floor: -0.10
    max_drawdown_long_floor: -0.25
    min_calmar_12m_long: null
    max_mdd_12m_rolling_long_floor: null
    max_turnover_long_monthly_last: 0.08
    min_alpha_simple_return_total: -0.02

ramp_stage: paper
