# Contrato de configuración — schema_version 1 (paper-first, perfil moderado)
# Comentarios en español; valores numéricos en fracción decimal salvo que se indique.

schema_version: 1
profile: moderate

# Reparto objetivo corto/largo (debe sumar 1.0)
weights:
  short: 0.30
  long: 0.70

# Reparto geográfico AR/US sobre el total (debe sumar 1.0)
geo:
  AR: 0.20
  US: 0.80

# Drawdown mensual del bucket corto que dispara kill switch (valor negativo, p.ej. -8%)
short_kill_switch_monthly_dd: -0.08

# Cadencia de decisión por motor
cadence:
  short: daily
  long: weekly

# semi_auto: órdenes pasan a cola pending hasta confirmación; auto: pipeline sin gate humano
execution_mode: semi_auto

# Símbolos permitidos: rutas a listas separadas (ver config/symbols/) o vacío + inline en pruebas
symbols:
  whitelist_us_file: config/symbols/whitelist_us.yaml
  whitelist_ar_file: config/symbols/whitelist_ar.yaml
  whitelist_cedear_file: config/symbols/whitelist_cedear.yaml
  inline_us: []
  inline_ar: []
  # Selección dinámica top volumen (IOL) — desactivada por defecto hasta cablear fetch/runner
  universe_selection:
    enabled: false
    rebalance_frequency: weekly
    targets:
      merval_top_n: 10
      cedears_top_n: 20
    volume_window_trading_days: 20
    tiebreakers:
      - avg_notional_desc
      - symbol_asc
    api_budget:
      monthly_limit: 25000
      soft_limit_pct: 0.8
      max_calls_per_job: 2000

# Espejo operativo de POLICY.md (umbrales; el documento humano manda en ambigüedad)
risk:
  max_notional_per_ticker_pct: 0.08
  max_sector_pct: 0.25
  max_daily_loss_short_pct: -0.02
  max_daily_loss_long_pct: -0.015
  max_daily_loss_total_pct: -0.03
  max_monthly_loss_short_pct: -0.08
  max_monthly_loss_long_pct: -0.06
  max_monthly_loss_total_pct: -0.10
  no_trade_first_minutes: 15
  no_trade_last_minutes: 15
  news_window_enabled: false
  halt_on_data_quality: true
  adv_min_shares_day: 500000
  short_kill_switch_until: manual_reset  # alternativa documentada: month_end
  stop_loss:
    atr_multiplier: 2.0
    atr_lookback: 14
    fallback_pct_us: -0.05
    fallback_pct_ar: -0.08

# Motor largo (sleeve 70%): BYMA en pesos (Merval + CEDEAR). SPY como CEDEAR benchmark. Pesos suman 1.0 en el sleeve.
long_term_engine:
  drift_rebalance_threshold_pp: 2.0          # umbral por línea (pp) — convención per_line (POLICY §11)
  drift_convention: per_line
  rebalance_rule: first_ar_business_day_of_calendar_week
  max_long_rebalance_turnover_pct: null     # opcional: tope a sum(|Δw|) del sleeve; null = sin tope en engine v1
  satellite_markets:
    - AR
  core_lines:
    - symbol: GGAL
      target_weight: 0.42
    - symbol: PAMP
      target_weight: 0.43
  satellite_lines:
    - symbol: SPY
      target_weight: 0.15
  satellite_limits:
    max_satellite_weight_total: 0.20
    max_weight_per_satellite_line: 0.15
    max_satellite_names: 3

# Parámetros explícitos del short_term_engine v1 (Fase 3, señal diaria auditable)
short_term_engine:
  momentum_lookback_days: 20         # N días para retorno acumulado
  liquidity_percentile_min: 0.60     # p_min: percentil mínimo de volumen
  volatility_20d_max: 0.04           # vol_20d máxima (desvío estándar diario)
  top_k_per_market: 5                # K máximo por mercado en ranking diario
  risk_budget_trade_pct: 0.005       # presupuesto de riesgo por trade (0.5% del bucket corto)
  rsi_lookback: 14                   # RSI base para filtro de entrada/salida
  rsi_overbought_entry: 80.0         # no comprar si RSI supera este umbral; vender al cruzar hacia arriba este nivel
  rsi_exit_threshold: 45.0           # vender por crossover descendente bajo este umbral
  allow_leverage: false              # v1: sin apalancamiento

# Pre-gate estadístico mínimo (walk-forward OOS del bloque corto; Fase 3 plan)
short_term_pre_gate:
  enabled: true
  walk_forward:
    oos_trading_days: 12
    step_trading_days: 10
    min_oos_windows: 2
  thresholds:
    monthly_short_drawdown_floor: -0.25
    max_fee_pct_of_initial_per_window: 0.05
    max_turnover_annualized: 500.0

# Costos simulados por mercado (Fase 2 aplicará en broker paper)
markets:
  US:
    commission_bps_per_side: 1.0
    slippage_bps: 2.0
  AR:
    commission_bps_per_side: 15.0
    slippage_bps: 5.0

logging:
  level: INFO
  structured: true

# Placeholders sin secretos; credenciales fuera del repo (.env)
data_providers:
  us_ohlcv: placeholder_provider_us
  ar_ohlcv: placeholder_provider_ar

# Fuente única de verdad para sesiones y días hábiles por mercado.
calendar:
  source_of_truth: config/calendars/trading_days.v1.yaml
  us_market_code: XNYS
  ar_market_code: BYMA

# Corporate actions mínimas en v1 (US): splits y dividendos.
corporate_actions:
  us_file: config/corporate_actions/us_actions.v1.yaml
  supported_types:
    - split
    - dividend

# Parámetros del workflow de validación pre-live
validation_wf:
  lookback_trading_days: 90

# Gate KPI OOS (Fase 5): walk-forward del informe v3 por tramo + tabla maestra + pass/fail (umbrales opcionales por métrica)
kpi_oos_gate:
  enabled: true
  walk_forward:
    burn_in_trading_days: 252
    oos_trading_days: 60
    step_trading_days: 30
    min_oos_windows: 1
  aggregate:
    rule: all
  thresholds:
    min_sharpe_annualized_total: 0.30
    min_sortino_annualized_total: 0.40
    max_drawdown_total_floor: -0.18
    max_drawdown_short_floor: -0.10
    max_drawdown_long_floor: -0.25
    min_calmar_12m_long: null               # informativo; no bloqueante en v1
    max_mdd_12m_rolling_long_floor: null     # informativo; no bloqueante en v1
    max_turnover_long_monthly_last: 0.08
    min_alpha_simple_return_total: -0.02

# Fase de ramp-up hacia capital real (paper → live)
ramp_stage: paper
