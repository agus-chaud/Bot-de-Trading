name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (locked)
        run: pip install -r requirements.lock
      - name: Lint (ruff)
        run: |
          pip install ruff==0.15.16
          ruff check .
      - name: Run tests with coverage (core_sim)
        run: python -m pytest tests/ -v --cov=core_sim --cov-report=term-missing --cov-fail-under=80
