name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (locked)
        run: pip install -r requirements.lock
      - name: Lint (ruff)
        run: |
          pip install ruff==0.15.16
          ruff check .
      - name: Type check (mypy, informativo / no bloqueante)
        continue-on-error: true
        run: |
          pip install mypy==2.1.0
          mypy core_sim data
      - name: Run tests with coverage (módulos críticos)
        # Gate scoped a lo crítico: motores (core_sim) + pipeline de datos (data) +
        # orquestador live (run_paper_live). NO incluye scripts utilitarios (one-off,
        # muchos al 0%) para no envenenar el promedio. Combinado actual ~90% → piso 85.
        run: python -m pytest tests/ -v --cov=core_sim --cov=data --cov=scripts.run_paper_live --cov-report=term-missing --cov-fail-under=85
