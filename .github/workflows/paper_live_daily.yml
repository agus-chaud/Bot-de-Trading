name: Paper Live Daily

on:
  schedule:
    # 10:00 UTC Mon–Fri (post US market close)
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Target trading day (YYYY-MM-DD). Leave empty for previous weekday."
        required: false
        type: string

concurrency:
  group: paper-live-daily
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-live-data
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock

      - name: Fetch latest OHLCV
        env:
          IOL_USER: ${{ secrets.IOL_USER }}
          IOL_PASS: ${{ secrets.IOL_PASS }}
        run: python scripts/fetch_daily.py --lookback 5 --db data/market.db

      - name: Run paper-live script
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/run_paper_live.py $DATE_ARG --db data/market.db --initial-cash 1000000 --currency ARS --enable-long-engine

      - name: Export dashboard payload (F1-02 / F1-03)
        run: |
          python scripts/export_dashboard_payload.py \
            --db data/market.db \
            --out data/dashboard_payload.json \
            --pretty

      - name: Stage dashboard payload for Vercel (F1-05)
        run: |
          mkdir -p web/public
          cp data/dashboard_payload.json web/public/dashboard_payload.json

      - name: Upload dashboard payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-payload
          path: data/dashboard_payload.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push DB + dashboard payload (F1-03 / ADR-065)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/market.db data/dashboard_payload.json web/public/dashboard_payload.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "paper-live: $(date -u +%Y-%m-%d) daily run"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel production rebuild (F1-05)
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK not set — relying on Git push to paper-live-data only."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Vercel deploy hook triggered."

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `paper-live FAILED: ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run failed. [See logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['paper-live', 'bug']
            });
